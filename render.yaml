services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: gts-invoice-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: gts-invoice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: 12
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: DEFAULT_CURRENCY
        value: INR
      - key: FINANCIAL_YEAR_START_MONTH
        value: 4
      - key: SUBMISSION_WARNING_DAYS
        value: 3
      - key: VARIANCE_TOLERANCE_PERCENT
        value: 5

  # ── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: gts-invoice-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://gts-invoice-backend.onrender.com

# ── PostgreSQL Database ────────────────────────────────────────────────────────
databases:
  - name: gts-invoice-db
    databaseName: gts_invoice
    user: gts_invoice_user
    plan: free
